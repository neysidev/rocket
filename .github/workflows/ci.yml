name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build -Xswiftc -warnings-as-errors
      - run: swift test
      - run: brew install xcodegen && mkdir -p .build/generated && xcodegen generate
      - run: xcodebuild -project Rocket.xcodeproj -scheme Rocket -configuration Debug -derivedDataPath .build/xcode build
